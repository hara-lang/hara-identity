[build]
  publish = "site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/v1/identity-client.js"
  to = "/identity-client.js"
  status = 200
  force = true

[[headers]]
  for = "/identity-client.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"
    Cross-Origin-Resource-Policy = "cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/v1/identity-client.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"
    Cross-Origin-Resource-Policy = "cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
