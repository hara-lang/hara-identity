name: Recover world.testing.hara-lang.org

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-world-testing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-world-testing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out reviewed Hara World main
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-world
          ref: main
          path: world
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and validate World without deployment credentials
        working-directory: world
        run: |
          npm install
          npm run check
          npx --yes netlify-cli --version
      - name: Deploy the validated World bundle to testing
        working-directory: world
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 13d913c8-553b-4c1b-8de9-8ace2ff35d5e
        run: npx --yes netlify-cli deploy --prod --dir dist --message "World recovery ${GITHUB_SHA}"
      - name: Print public readiness diagnostics
        run: |
          set -u
          echo '--- Identity session discovery'
          curl --silent --show-error --max-time 30 https://id.testing.hara-lang.org/.well-known/hara-session | jq .
          echo '--- Identity handoff discovery'
          curl --silent --show-error --max-time 30 https://id.testing.hara-lang.org/.well-known/hara-handoff | jq .
          echo '--- World discovery'
          curl --silent --show-error --max-time 30 https://world.testing.hara-lang.org/.well-known/hara-world | jq .
          echo '--- World active readiness'
          curl --silent --show-error --max-time 30 https://world.testing.hara-lang.org/.well-known/hara-world-readiness | jq .
          echo '--- World unauthenticated session'
          curl --silent --show-error --max-time 30 https://world.testing.hara-lang.org/api/auth/session | jq .
      - name: Verify World testing and the shared Identity contract
        working-directory: world
        env:
          WORLD_ORIGIN: https://world.testing.hara-lang.org
          IDENTITY_ORIGIN: https://id.testing.hara-lang.org
          REQUIRE_IDENTITY_CONFIGURED: "true"
          REQUIRE_WORLD_AUTH_CONFIGURED: "true"
          REQUIRE_PROFILE_PUBLISHER_CONFIGURED: "true"
        run: bash .github/scripts/verify-world-site.sh
