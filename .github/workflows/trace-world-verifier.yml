name: Trace Hara World verifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trace-world-verifier.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-world
          ref: main
          persist-credentials: false
      - name: Trace live testing verification
        env:
          WORLD_ORIGIN: https://world.testing.hara-lang.org
          IDENTITY_ORIGIN: https://id.testing.hara-lang.org
          REQUIRE_IDENTITY_CONFIGURED: "true"
          REQUIRE_WORLD_AUTH_CONFIGURED: "true"
          REQUIRE_PROFILE_PUBLISHER_CONFIGURED: "true"
        run: bash -x .github/scripts/verify-world-site.sh
