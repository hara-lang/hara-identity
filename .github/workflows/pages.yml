name: Deploy id.hara-lang.org

on:
  push:
    branches: [main, testing]
    paths: [site/**, netlify/**, netlify.toml, test/**, package.json, README.md, docs/**, .github/scripts/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-id-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test functions and identity client
        run: node --test test/*.mjs
      - name: Deploy testing to id.testing.hara-lang.org
        if: github.ref_name == 'testing'
        run: npx --yes netlify-cli deploy --prod --dir site --message "testing ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
      - name: Deploy main to id.hara-lang.org
        if: github.ref_name == 'main'
        run: npx --yes netlify-cli deploy --prod --dir site --message "main ${GITHUB_SHA}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
      - name: Reconcile id.testing.hara-lang.org
        if: github.ref_name == 'testing'
        run: bash .github/scripts/reconcile-netlify-domain.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_TESTING_SITE_ID }}
          NETLIFY_CUSTOM_DOMAIN: id.testing.hara-lang.org
      - name: Verify every testing relying origin
        if: github.ref_name == 'testing'
        env:
          HARA_IDENTITY_ORIGIN: https://id.testing.hara-lang.org
        run: |
          for consumer in \
            https://www.testing.hara-lang.org \
            https://build.testing.hara-lang.org \
            https://packages.testing.hara-lang.org \
            https://id.testing.hara-lang.org \
            https://learn.testing.hara-lang.org; do
            HARA_CONSUMER_ORIGIN="$consumer" \
              bash .github/scripts/verify-identity-consumer.sh
          done
      - name: Verify testing Learn session handoff
        if: github.ref_name == 'testing'
        run: bash .github/scripts/verify-learn-handoff.sh
        env:
          HARA_IDENTITY_ORIGIN: https://id.testing.hara-lang.org
          HARA_LEARN_ORIGIN: https://learn.testing.hara-lang.org
      - name: Reconcile id.hara-lang.org
        if: github.ref_name == 'main'
        run: bash .github/scripts/reconcile-netlify-domain.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PRODUCTION_SITE_ID }}
          NETLIFY_CUSTOM_DOMAIN: id.hara-lang.org
      - name: Verify every production relying origin
        if: github.ref_name == 'main'
        env:
          HARA_IDENTITY_ORIGIN: https://id.hara-lang.org
        run: |
          for consumer in \
            https://www.hara-lang.org \
            https://build.hara-lang.org \
            https://packages.hara-lang.org \
            https://id.hara-lang.org \
            https://learn.hara-lang.org; do
            HARA_CONSUMER_ORIGIN="$consumer" \
              bash .github/scripts/verify-identity-consumer.sh
          done
      - name: Verify production Learn session handoff
        if: github.ref_name == 'main'
        run: bash .github/scripts/verify-learn-handoff.sh
        env:
          HARA_IDENTITY_ORIGIN: https://id.hara-lang.org
          HARA_LEARN_ORIGIN: https://learn.hara-lang.org
